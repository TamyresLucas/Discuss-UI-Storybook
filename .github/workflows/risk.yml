name: Risk

# Classifies each PR as low / medium / high risk (scripts/assess-risk.mjs).
# High risk cannot merge until a human adds the `risk-approved` label.
# Require the `risk` check on main so auto-merge waits for this.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The release bot's PR is opened with GITHUB_TOKEN and doesn't trigger
  # pull_request workflows, so report on its branch push instead. It is
  # generated by changesets, so it is not assessed.
  push:
    branches: [changeset-release/main]

concurrency:
  group: risk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assess risk
        id: assess
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/main
        run: node scripts/assess-risk.mjs
      - name: Label the PR with its risk level
        if: github.event_name == 'pull_request'
        continue-on-error: true # fork PRs get a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          LEVEL: ${{ steps.assess.outputs.level }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for l in low medium high; do
            gh label create "risk:$l" --force >/dev/null 2>&1 || true
          done
          gh pr edit "$PR" --add-label "risk:$LEVEL" \
            $(for l in low medium high; do [ "$l" != "$LEVEL" ] && echo "--remove-label risk:$l"; done)
      - name: Require human approval for high risk
        if: github.event_name == 'pull_request' && steps.assess.outputs.level == 'high'
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'risk-approved') }}
        run: |
          if [ "$APPROVED" != "true" ]; then
            echo "::error::High-risk change. A human must review it and add the 'risk-approved' label."
            exit 1
          fi
