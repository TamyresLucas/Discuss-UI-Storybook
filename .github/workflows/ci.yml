name: CI

on:
  pull_request:
    branches: [main]
  # The release bot's "Version Packages" PR is opened with GITHUB_TOKEN, which
  # doesn't trigger pull_request workflows, so run on its branch push instead.
  push:
    branches: [changeset-release/main]

# A new push to the same PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changeset status diffs against origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @discuss-ds/ui test
      # Every change to tokens or ui needs a changeset (see CLAUDE.md).
      - name: Changeset present
        if: github.event_name == 'pull_request'
        run: pnpm exec changeset status --since=origin/main
      # Builds tokens, ui (type-checked via tsup), Storybook and the playground.
      - run: pnpm build
